[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hobby-db"
version = "0.1.0"
description = "Personal hobby collection database backed by Google Sheets and AppSheet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-auth>=2.29",
    "gspread>=6.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "playwright>=1.45",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hobby_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "RUF001", # full-width Japanese characters are intentional in string literals
    "RUF002", # full-width Japanese characters are intentional in docstrings
    "RUF003", # full-width Japanese characters are intentional in comments
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
